<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickam Dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b120e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pickam">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ee; --surface: #ffffff; --surface-2: #f1eee6; --ink: #0f1a14; --muted: #6b7770; --faint: #9aa59e; --line: #ebe7dd;
    --brand: #0a7a3e; --brand-ink: #ffffff; --brand-soft: #e4f2e9; --deep: #052e1b; --lime: #c6f36d;
    --jollof: #f2611d; --jollof-soft: #fdeee5; --danger: #d93025; --danger-soft: #fdecea; --warn: #b26a00; --warn-soft: #fbf1df;
    --radius: 18px; --radius-sm: 12px; --shadow: 0 1px 2px rgba(15,26,20,.04), 0 8px 24px -12px rgba(15,26,20,.12);
    --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --nav-h: 68px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b120e; --surface: #121a15; --surface-2: #18221c; --ink: #e8ede9; --muted: #93a099; --faint: #6a776f; --line: #1f2a23;
      --brand: #2fb36a; --brand-ink: #04170c; --brand-soft: #143322; --jollof-soft: #3a1e10; --danger: #ff6b6b; --danger-soft: #3a1515; --warn: #f0a840; --warn-soft: #33260f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { font: 15px/1.5 var(--body); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--display); letter-spacing: -.02em; line-height: 1.15; margin: 0; }
  h1 { font-size: 28px; font-weight: 800; } h2 { font-size: 20px; font-weight: 700; } h3 { font-size: 16px; font-weight: 700; }
  p { margin: 0; }
  a { color: var(--brand); text-decoration: none; }
  svg.i { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; }
  .stack > * + * { margin-top: 12px; } .stack-lg > * + * { margin-top: 24px; }
  .row { display: flex; align-items: center; gap: 12px; } .row.between { justify-content: space-between; } .grow { flex: 1; min-width: 0; }
  .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0;
    font: 600 15px var(--body); cursor: pointer; text-decoration: none; transition: transform .12s ease, opacity .12s, background .15s; white-space: nowrap; }
  .btn:active { transform: scale(.97); } .btn:disabled { opacity: .55; cursor: default; }
  .btn-primary { background: var(--brand); color: var(--brand-ink); }
  .btn-dark { background: var(--deep); color: #fff; }
  .btn-secondary { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .btn-soft { background: var(--brand-soft); color: var(--brand); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-sm { min-height: 36px; padding: 0 14px; font-size: 14px; }
  .btn-block { width: 100%; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; }
  .icon-btn.on { background: var(--brand-soft); color: var(--brand); box-shadow: none; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 2px; }

  /* Forms */
  .field { display: block; }
  .field > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .input, .field input, .field select, .field textarea { width: 100%; font: 16px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; transition: border-color .15s, box-shadow .15s; }
  .field textarea { min-height: 88px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus, .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 14%, transparent); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } }

  /* Switch */
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
  .switch input:checked + span { background: var(--brand); }
  .switch input:checked + span::after { transform: translateX(20px); }

  /* Surfaces */
  .card { background: var(--surface); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .card.flush { padding: 0; overflow: hidden; }
  .card.hero { background: var(--deep); color: #fff; box-shadow: none; }
  .card.hero .muted { color: rgba(255,255,255,.7); }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 4px 12px; }
  .section-title h2 { font-size: 18px; }
  .list > * + * { border-top: 1px solid var(--line); }
  .item { display: flex; align-items: center; gap: 14px; padding: 16px 20px; background: none; border: 0; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .item .chev { color: var(--faint); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--brand-soft); color: var(--brand); font-weight: 700; }
  .avatar.warm { background: var(--jollof-soft); color: var(--jollof); }
  .avatar.danger { background: var(--danger-soft); color: var(--danger); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .badge.green { background: var(--brand-soft); color: var(--brand); } .badge.red { background: var(--danger-soft); color: var(--danger); }
  .badge.amber { background: var(--warn-soft); color: var(--warn); } .badge.orange { background: var(--jollof-soft); color: var(--jollof); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .stat { background: rgba(255,255,255,.07); border-radius: 14px; padding: 12px; }
  .stat b { display: block; font: 700 22px var(--display); letter-spacing: -.02em; }
  .stat span { font-size: 12px; color: rgba(255,255,255,.65); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 4px rgba(198,243,109,.18); display: inline-block; }
  .status-dot.off { background: var(--jollof); box-shadow: 0 0 0 4px rgba(242,97,29,.18); }
  .empty { text-align: center; padding: 40px 24px; }
  .empty .bubble { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; background: var(--brand-soft); color: var(--brand); }
  .empty .bubble svg.i { width: 28px; height: 28px; }
  .empty h3 { margin-bottom: 6px; }
  .meter { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; } .meter > div { height: 100%; background: var(--brand); border-radius: 999px; }
  .divider { height: 1px; background: var(--line); margin: 18px 0; }

  /* Setup steps */
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
  .steps .btn { flex: none; }
  .steps li + li { border-top: 1px solid var(--line); }
  .steps .num { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
  .steps li.done .num { background: var(--brand); color: var(--brand-ink); }
  .steps li.done h3 { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
  .progress { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 12px; } .progress > div { height: 100%; background: var(--brand); }

  /* Segmented choice + dial code */
  .choice { display: grid; gap: 10px; }
  .choice label { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; }
  .choice label.on { box-shadow: inset 0 0 0 2px var(--brand); background: color-mix(in srgb, var(--brand-soft) 50%, var(--surface)); }
  .choice input { margin: 3px 0 0; accent-color: var(--brand); width: 18px; height: 18px; flex: none; }
  .choice b { display: block; } .choice small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .code-box { text-align: center; padding: 22px 16px; border-radius: 16px; background: var(--surface-2); border: 1.5px dashed var(--line); }
  .code-box { overflow-x: auto; }
  .code-box .code { font: 700 clamp(17px, 5.6vw, 30px) ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .5px; white-space: nowrap; color: var(--ink); }
  .kbd { font-family: ui-monospace, Menlo, monospace; font-weight: 600; background: var(--surface-2); padding: 2px 8px; border-radius: 6px; }

  /* Callback card */
  .cb-head { display: flex; gap: 12px; align-items: center; }
  .cb-q { font: 600 17px/1.35 var(--display); letter-spacing: -.01em; margin: 14px 0 6px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; } .actions .btn { flex: 1; }

  /* Settings */
  .group { margin-top: 28px; } .group > h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-family: var(--body); font-weight: 600; margin: 0 4px 10px; }
  .set-row { display: flex; align-items: center; gap: 16px; padding: 16px 20px; }
  .set-row .grow b { display: block; font-weight: 600; } .set-row .grow small { display: block; color: var(--muted); font-size: 13px; }
  .card.form { display: grid; gap: 16px; }

  /* App shell */
  .topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px);
    padding: calc(env(safe-area-inset-top) + 12px) 20px 12px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 800 20px var(--display); letter-spacing: -.03em; color: var(--ink); }
  .brand img { width: 32px; height: 32px; border-radius: 10px; }
  .brand b { color: var(--brand); }
  main { max-width: 680px; margin: 0 auto; padding: 8px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 32px); }
  .page-head { margin: 8px 4px 20px; } .page-head p { margin-top: 4px; }
  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: saturate(1.4) blur(16px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabbar button { flex: 1; max-width: 96px; display: grid; justify-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; color: var(--faint); font: 600 11px var(--body); cursor: pointer; position: relative; }
  nav.tabbar button.active { color: var(--brand); }
  nav.tabbar .dot { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 11px; display: grid; place-items: center; }
  @media (min-width: 960px) {
    nav.tabbar { top: 0; right: auto; width: 232px; flex-direction: column; justify-content: flex-start; gap: 4px; padding: 88px 14px 20px; border-top: 0; border-right: 1px solid var(--line); }
    nav.tabbar button { flex: none; max-width: none; display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 12px; font-size: 14px; color: var(--muted); }
    nav.tabbar button.active { background: var(--brand-soft); }
    nav.tabbar .dot { position: static; margin-left: auto; }
    .topbar { padding-left: 252px; } main { padding-left: 248px; max-width: 928px; padding-bottom: 48px; }
  }

  /* Banners, toast, auth */
  .banner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; margin: 4px 0 16px; font-weight: 600; }
  .banner.ring { background: var(--danger); color: #fff; cursor: pointer; animation: pulse 1.4s infinite; }
  .banner.limit { background: var(--warn-soft); color: var(--warn); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--danger) 20%, transparent); } }
  #toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 500; z-index: 60; max-width: calc(100vw - 32px); transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .auth { min-height: 100dvh; display: grid; place-items: center; padding: 24px 20px; }
  .auth-card { width: min(420px, 100%); min-width: 0; }
  .auth { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  .auth .logo-big { width: 64px; height: 64px; border-radius: 20px; margin-bottom: 24px; box-shadow: var(--shadow); }
  .phone-input { display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); overflow: hidden; }
  .phone-input span { padding: 0 12px 0 14px; color: var(--muted); font-weight: 600; border-right: 1px solid var(--line); }
  .phone-input input { border: 0; box-shadow: none; flex: 1; font: 18px var(--body); padding: 14px; background: none; color: var(--ink); }
  .phone-input:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 14%, transparent); }
  .phone-input input:focus { outline: none; }
  .otp { text-align: center; font: 600 28px ui-monospace, Menlo, monospace !important; letter-spacing: .5em; padding-left: .5em !important; }
  .wizard-top { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .wizard-top .progress { flex: 1; margin: 0; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(5,20,12,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
  .sheet { width: min(560px, 100%); max-height: 88dvh; overflow: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); animation: up .22s cubic-bezier(.2,.9,.3,1.1); }
  .sheet .grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line); margin: 0 auto 14px; }
  @media (min-width: 640px) { .sheet-bg { align-items: center; } .sheet { border-radius: 24px; } }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } } @keyframes fade { from { opacity: 0; } }
  .transcript p { padding: 10px 14px; border-radius: 14px; background: var(--surface); margin-top: 8px; max-width: 88%; }
  .transcript p.me { margin-left: auto; background: var(--brand-soft); }
  .transcript b { display: block; font-size: 12px; color: var(--muted); }
  .plan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .plan-card { background: var(--surface); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
  .plan-card.current { box-shadow: inset 0 0 0 2px var(--brand); }
  .plan-card .price { font: 800 26px var(--display); letter-spacing: -.02em; }
  .plan-card .btn { margin-top: auto; }
</style>
</head>
<body>

<!-- Login -->
<section class="auth" id="login" hidden>
  <div class="auth-card">
    <img class="logo-big" src="/icons/icon-192.png" alt="">
    <div id="loginPhone" class="stack">
      <h1>Welcome to Pickam</h1>
      <p class="muted">Log in or create your account with your phone number. We'll text you a code.</p>
      <div style="height:12px"></div>
      <label class="field"><span>Phone number</span>
        <div class="phone-input"><span>🇳🇬 +234</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="803 123 4567"></div></label>
      <button class="btn btn-primary btn-block" onclick="sendCode(this)">Continue</button>
      <p class="small muted center">New here? This also creates your account, with a 14-day free trial.</p>
    </div>
    <div id="loginCode" class="stack" hidden>
      <h1>Enter your code</h1>
      <p class="muted" id="codeHint">We sent a 6-digit code by SMS.</p>
      <div style="height:12px"></div>
      <input id="code" class="input otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
      <button class="btn btn-primary btn-block" onclick="verifyCode(this)">Log in</button>
      <button class="btn btn-secondary btn-block" onclick="showPhoneStep()">Use a different number</button>
    </div>
  </div>
</section>

<!-- Signup wizard -->
<section class="auth" id="wizard" hidden><div class="auth-card" id="wizardBody"></div></section>

<!-- App -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><img src="/icons/icon-192.png" alt=""><span><b>Pick</b>am</span></div>
    <div class="grow"></div>
    <button class="icon-btn" id="soundBtn" onclick="enableSound()" aria-label="Turn on alert sound" title="Alert sound"></button>
  </header>
  <main>
    <div id="banners"></div>
    <div id="view"></div>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>
<div id="sheetRoot"></div>
<div id="toast" role="status"></div>

<script>
// ---- Icons ----
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  orders: '<path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  calls: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  bellOff: '<path d="M8.7 3A6 6 0 0 1 18 8a21 21 0 0 0 .6 5M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7M10.3 21a1.94 1.94 0 0 0 3.4 0M2 2l20 20"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M8 7h8M8 11h6"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/>',
  settings: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  sparkle: '<path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/>',

  wallet: '<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16" cy="14" r="1.3"/>',

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(path, { method: opts.method || "GET", headers, body: opts.body && JSON.stringify(opts.body) });
  if (res.status === 401 && path.startsWith("/api")) { logout(true); throw new Error("unauthorized"); }
  if (!res.ok) { const e = await res.json().catch(() => ({})); const msg = e.error || "Something went wrong. Please try again."; if (!opts.quiet) toast(msg); throw new Error(msg); }
  return res.status === 204 ? null : res.json();
}

// ---- Alert sound: a "ping ping" made with WebAudio, so no audio file is needed ----
function soundIcon() { $("soundBtn").innerHTML = icon(audio ? "bell" : "bellOff"); $("soundBtn").classList.toggle("on", !!audio); }
function enableSound() {
  audio = audio || new AudioContext(); audio.resume(); ping(); soundIcon();
  toast("Alert sound is on. Keep this screen open to hear new callbacks.");
}
function ping() {
  if (!audio) return;
  [0, 0.25].forEach((delay) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
    const t = audio.currentTime + delay; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.start(t); o.stop(t + 0.2);
  });
}

function startRing() { ringing = true; renderBanners(); if (!ringTimer) { ping(); ringTimer = setInterval(ping, 2000); } }

function listen() {
  events?.close();
  events = new EventSource("/api/alerts/stream?token=" + encodeURIComponent(token));
  events.onmessage = (m) => {
    const a = JSON.parse(m.data);
    if (a.mode === "ring") startRing(); else if (a.mode === "notify") ping();
    if (a.mode !== "digest" && !isStandalone() && "Notification" in window && Notification.permission === "granted" && !pushOn()) new Notification(a.title, { body: a.body });
    refresh();
  };
}

function b64ToBytes(b64) {
  const s = atob((b64 + "=".repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/"));

async function enablePush(btn) {

    const reg = await navigator.serviceWorker.ready;

    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
    await api("/api/push/subscribe", { method: "POST", body: sub.toJSON() });

// ---- Actions ----
async function escUpdate(btn, id, status, silent) {
  const ownerAnswer = $("ans" + id)?.value.trim();
  if (status === "resolved" && !ownerAnswer) return toast("Type your answer first");
  const r = await busy(btn, () => api(`/api/escalations/${id}`, { method: "PATCH", body: { status, ownerAnswer: ownerAnswer || undefined, saveAsFaq: status === "resolved" && checked("save" + id), callBack: status === "resolved" && checked("cb" + id) } }));
  const ada = state.business.settings.agentName;
  const msg = { calling: `${ada} is calling them now`, no_number: "Saved. There's no number to call back on.", not_set_up: "Saved. Connect your number so Ada can call back.", failed: "Couldn't call, so your answer was sent by SMS" };
  if (!silent) toast(msg[r.callback] || "Saved");
  ackRing(); render();
}
async function orderStatus(id, status) { await api(`/api/orders/${id}`, { method: "PATCH", body: { status } }); render(); }
async function addProduct(btn) {
  if (!val("pName").trim() || val("pPrice") === "") return toast("Add a name and price");
  await busy(btn, () => api("/api/products", { method: "POST", body: { name: val("pName").trim(), priceNaira: Number(val("pPrice")), description: val("pDesc") } }));
  closeSheet(); render();
}
async function toggleProduct(id, available) { await api(`/api/products/${id}`, { method: "PATCH", body: { available } }); render(); }
async function delProduct(id) { if (confirm("Delete this item?")) { await api(`/api/products/${id}`, { method: "DELETE" }); render(); } }
async function addFaq(btn) {
  if (!val("fA").trim()) return toast("Write Ada's answer");
  await busy(btn, () => api("/api/faqs", { method: "POST", body: { question: val("fQ"), answer: val("fA") } }));
  closeSheet(); render();
}
async function delFaq(id) { if (confirm("Delete this answer?")) { await api(`/api/faqs/${id}`, { method: "DELETE" }); render(); } }
async function getNumber(btn) { await busy(btn, () => api("/api/number/provision", { method: "POST" })); refresh(); }
async function buyPlan(btn, plan) { const r = await busy(btn, () => api("/api/billing/checkout", { method: "POST", body: { plan } })); location.href = r.url; }
async function topUp(btn) { const r = await busy(btn, () => api("/api/billing/checkout", { method: "POST", body: { walletAmountNaira: Number(val("topup")) } })); location.href = r.url; }
async function connectBank(btn) {
  if (!val("bank")) return toast("Choose your bank");
  const r = await busy(btn, () => api("/api/payouts", { method: "POST", body: { bankCode: val("bank"), accountNumber: val("acct") } }));
  toast("Connected: " + r.accountName); refresh();
}
async function saveSettings(btn) {
  const profile = Object.fromEntries(["name", "category", "location", "openingHours", "ownerName", "description", "deliveryInfo"].map((k) => [k, val(k)]));
  const settings = {
    agentName: val("agentName"), greeting: val("greeting"), languageStyle: val("languageStyle"), takeOrders: checked("takeOrders"), paymentLinks: checked("paymentLinks"),
    paymentInstructions: val("paymentInstructions"), extraRules: val("extraRules"), callbackMinutes: Number(val("callbackMinutes")),
    alerts: { urgent: val("al_urgent"), normal: val("al_normal"), low: val("al_low") }, whatsappAlerts: checked("whatsappAlerts"), smsAlerts: checked("smsAlerts"),
    aiCallsBack: checked("aiCallsBack"), apologySms: checked("apologySms"),
    quietHours: { enabled: checked("qhOn"), start: val("qhStart"), end: val("qhEnd") }, dailySummary: { enabled: checked("dsOn"), time: val("dsTime") },
  };
  await busy(btn, async () => {
    await api("/api/business", { method: "PUT", body: { profile, settings } });
    try { await api("/api/agent/sync", { method: "POST", quiet: true }); toast("Saved. Ada is up to date."); } catch { toast("Saved. Ada will update shortly."); }
  });
  await loadBusiness();
}

// Bank list loads when the payout form appears.
new MutationObserver(async () => {
  const sel = $("bank"); if (!sel || sel.dataset.loaded) return; sel.dataset.loaded = 1;
  try { const banks = await api("/api/payouts/banks", { quiet: true }); sel.innerHTML = `<option value="">Choose your bank</option>` + banks.map((b) => `<option value="${esc(b.code)}">${esc(b.name)}</option>`).join(""); }
  catch { sel.innerHTML = `<option value="">Couldn't load banks</option>`; }
}).observe($("view"), { childList: true });

if (token) { lsSet("pickamToken", token); start(); } else { $("login").hidden = false; }
</script>
</body>
</html>
